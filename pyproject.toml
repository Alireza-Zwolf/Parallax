[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-audit"
version = "1.0.0"
description = "Statistical deviation analysis of LLM behavior against peer models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
embed = ["torch>=2.0", "sentence-transformers>=2.2"]
query = ["openai>=1.40", "google-generativeai>=0.8", "boto3>=1.34"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
parallax-audit = "parallax_audit.cli:main"

[tool.setuptools]
packages = ["parallax_audit", "parallax_audit.query", "parallax_audit.score", "parallax_audit.stats"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
parallax_audit = ["config/*.yaml", "config/questions/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
addopts = "-m 'not gpu and not archive'"
markers = ["gpu: optional GPU/model-download integration", "archive: full archived-corpus regression"]
